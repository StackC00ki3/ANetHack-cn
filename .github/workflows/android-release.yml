name: Android APK Release

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-prerelease
  cancel-in-progress: true

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout submodules
        run: |
          set -euo pipefail

          git submodule sync --recursive
          git submodule update --init --recursive

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-34 build-tools;34.0.0 cmake;3.22.1 ndk;25.1.8937393

      - name: Disable local proxy settings on CI
        run: sed -i '/^systemProp\..*proxy/d' gradle.properties

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Prepare release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required GitHub secret: ${name}"
              exit 1
            fi
          done

          keystore_file="${RUNNER_TEMP}/anethack-release.jks"
          printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > "${keystore_file}"
          test -s "${keystore_file}"

          {
            echo "ANDROID_KEYSTORE_FILE=${keystore_file}"
            echo "ANDROID_KEYSTORE_PASSWORD=${ANDROID_KEYSTORE_PASSWORD}"
            echo "ANDROID_KEY_ALIAS=${ANDROID_KEY_ALIAS}"
            echo "ANDROID_KEY_PASSWORD=${ANDROID_KEY_PASSWORD}"
          } >> "${GITHUB_ENV}"

      - name: Build release APK
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Verify release APK signatures
        run: |
          set -euo pipefail

          shopt -s nullglob
          apks=(app/build/outputs/apk/release/*.apk)
          if [ "${#apks[@]}" -eq 0 ]; then
            echo "::error::No release APKs found"
            exit 1
          fi

          for apk in "${apks[@]}"; do
            "${ANDROID_HOME}/build-tools/34.0.0/apksigner" verify --verbose --print-certs "${apk}"
          done

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ANetHack-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Create GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          tag="prerelease"
          title="Prerelease ${GITHUB_SHA::7}"
          notes="Automated prerelease APKs for ${GITHUB_REF_NAME} at ${GITHUB_SHA}. Most devices should install the arm64-v8a APK; use the universal APK (no ABI suffix) if unsure."

          git tag -f "${tag}" "${GITHUB_SHA}"
          git push -f origin "refs/tags/${tag}"

          if gh release view "${tag}" >/dev/null 2>&1; then
            gh release edit "${tag}" \
              --title "${title}" \
              --notes "${notes}" \
              --prerelease
            gh release upload "${tag}" app/build/outputs/apk/release/*.apk --clobber
          else
            gh release create "${tag}" app/build/outputs/apk/release/*.apk \
              --title "${title}" \
              --notes "${notes}" \
              --prerelease
          fi
